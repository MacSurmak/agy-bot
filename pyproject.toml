# ==============================================================================
# STRICT ARCHITECTURAL POLICY: ZERO LEGACY DEPENDENCIES OR SYNTAX (LATE-2026+)
# ==============================================================================
# 1. It is STRICTLY FORBIDDEN to introduce dependencies, pins, or APIs from 2025
#    or early 2026 (e.g., Python 3.12/3.13, SQLAlchemy 2.0.x, MCP 1.x FastMCP,
#    PostgreSQL 17, cryptg 0.4, pytest 8.x, or legacy typing imports).
# 2. All dependencies MUST track the latest stable late-2026+ releases:
#    - Python >= 3.14 (3.14 / 3.15 modern syntax & PEP 649 semantics)
#    - PostgreSQL 18.6+
#    - SQLAlchemy >= 2.1.6 (Active 2.1 series, async Mapped[...] only)
#    - MCP SDK >= 2.3.0 (Strictly use `from mcp.server import MCPServer`)
#    - Pydantic >= 2.14.2, Cryptography >= 50.0.2, Telethon >= 1.45.0
# ==============================================================================

[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-telegram-core"
version = "1.0.0"
description = "24/7 Telegram MTProto Command Center & Orchestrator for Google Antigravity CLI (agy)"
requires-python = ">=3.14"
dependencies = [
    "telethon>=1.45.0",
    "cryptg>=0.6.0",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "cryptography>=50.0.2",
    "sqlalchemy[asyncio]>=2.1.6",
    "asyncpg>=0.32.0",
    "alembic>=1.20.1",
    "apscheduler>=3.11.3",
    "mcp>=2.3.0",
    "structlog>=25.4.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.17.3",
    "mypy>=2.4.0",
    "types-PyYAML>=6.0.12.20250915",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[project.scripts]
antigravity-core = "antigravity_core.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "telethon.*",
    "apscheduler.*",
    "cryptg.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "ASYNC", "RUF"]
ignore = ["E501"]
