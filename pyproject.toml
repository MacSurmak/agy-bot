[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-telegram-core"
version = "1.0.0"
description = "24/7 Telegram MTProto Command Center & Orchestrator for Google Antigravity CLI (agy)"
readme = "00_master_architecture_and_specification.md"
requires-python = ">=3.12"
dependencies = [
    "telethon>=1.37.0",
    "cryptg>=0.4.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "cryptography>=43.0.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.13.3",
    "apscheduler>=3.10.4",
    "mcp>=1.2.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.12",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
antigravity-core = "antigravity_core.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "telethon.*",
    "apscheduler.*",
    "cryptg.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "ASYNC", "RUF"]
ignore = ["E501"]
