# STRICT ZERO-LEGACY POLICY:
# Never downgrade to PostgreSQL 17 or older images, and never use the legacy
# /var/lib/postgresql/data mount path. Strictly maintain PostgreSQL 18.6+
# with the canonical /var/lib/postgresql volume mount point.
services:
  postgres:
    image: postgres:18.6-alpine
    container_name: antigravity_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
    driver: local
