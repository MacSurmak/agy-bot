# Minimal static configuration for Antigravity Telegram Core.
# Database credentials are read automatically from .env (POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB).
# All runtime paths, Python interpreter, and agy binary paths are resolved automatically.

telegram:
  api_id: 12345678
  api_hash: "0123456789abcdef0123456789abcdef"
  bot_token: "1234567890:AAH_your_bot_token_here"
  owner_telegram_id: 123456789
  forum_chat_id: -1001234567890

security:
  # Generate with: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  fernet_master_key: "REPLACE_WITH_32_BYTE_URLSAFE_BASE64_FERNET_KEY="
